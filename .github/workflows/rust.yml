name: Rust

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]  # Also trigger on version tags
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      run: cargo test --verbose

  # Release job only runs when pushing a tag
  release:
    needs: build  # Wait for build to succeed
    if: startsWith(github.ref, 'refs/tags/v')  # Only run for version tags
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build release
      run: cargo build --verbose --release
      
    - name: List binary location
      run: ls -l target/release/

    - name: Get binary name
      id: get_binary
      run: |
        BINARY_NAME=$(cargo metadata --format-version 1 | jq -r '.packages[0].name')
        echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_OUTPUT
    
    - name: Package Binary
      run: |
        cd target/release
        tar czf ../../${{ steps.get_binary.outputs.BINARY_NAME }}-linux-x64.tar.gz ${{ steps.get_binary.outputs.BINARY_NAME }}
        cd ../..
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.get_binary.outputs.BINARY_NAME }}-linux-x64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
