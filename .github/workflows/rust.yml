name: Rust Release

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            asset_suffix: linux-x64.tar.gz
            asset_content_type: application/gzip
          - os: macos-latest
            os_name: macos
            asset_suffix: macos-x64.tar.gz
            asset_content_type: application/gzip
          - os: windows-latest
            os_name: windows
            asset_suffix: windows-x64.zip
            asset_content_type: application/zip

    steps:
    - uses: actions/checkout@v4
    
    - name: Build release
      run: cargo build --verbose --release
      
    - name: Get binary name
      id: get_binary
      shell: bash
      run: |
        BINARY_NAME=$(cargo metadata --format-version 1 | jq -r '.packages[0].name')
        echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_OUTPUT
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          echo "BINARY_EXT=.exe" >> $GITHUB_OUTPUT
        else
          echo "BINARY_EXT=" >> $GITHUB_OUTPUT
        fi
    
    - name: Package Binary (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cd target/release
        tar czf ../../${{ steps.get_binary.outputs.BINARY_NAME }}-${{ matrix.asset_suffix }} ${{ steps.get_binary.outputs.BINARY_NAME }}${{ steps.get_binary.outputs.BINARY_EXT }}
        cd ../..

    - name: Package Binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path "target/release/${{ steps.get_binary.outputs.BINARY_NAME }}${{ steps.get_binary.outputs.BINARY_EXT }}" `
                        -DestinationPath "${{ steps.get_binary.outputs.BINARY_NAME }}-${{ matrix.asset_suffix }}"
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./${{ steps.get_binary.outputs.BINARY_NAME }}-${{ matrix.asset_suffix }}
        asset_name: ${{ steps.get_binary.outputs.BINARY_NAME }}-${{ matrix.asset_suffix }}
        asset_content_type: ${{ matrix.asset_content_type }}
